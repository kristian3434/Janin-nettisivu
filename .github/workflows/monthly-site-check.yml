name: Monthly site check

on:
  schedule:
    - cron: "13 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-site-check
  cancel-in-progress: false

jobs:
  monthly-site-check:
    name: Check portfolio buttons, links and files
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test tools
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run monthly checks
        id: site_check
        shell: bash
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://tulevaisuudentekija.janmyllymaki.workers.dev' }}
          BUTTON_CHECK_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://tulevaisuudentekija.janmyllymaki.workers.dev' }}
          CHECK_EXTERNAL_LINKS: "1"
          CHECK_ANALYTICS_POST: "0"
          CHECK_TIMEOUT_MS: "15000"
          BUTTON_CHECK_TIMEOUT_MS: "15000"
        run: |
          set +e
          node tools/monthly-site-check.mjs
          site_status=$?
          node tools/monthly-button-check.mjs
          button_status=$?
          status=0
          if [ "$site_status" -ne 0 ] || [ "$button_status" -ne 0 ]; then
            status=1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-site-check-report
          path: reports/monthly-site-checks/
          if-no-files-found: error

      - name: Commit report
        if: always()
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- reports/monthly-site-checks)" ]; then
            echo "No report changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monthly-site-checks
          git commit -m "Add monthly site check report"
          git push

      - name: Fail if site check failed
        if: steps.site_check.outputs.status != '0'
        run: exit 1
