name: Monthly site check

on:
  schedule:
    - cron: "13 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-site-check
  cancel-in-progress: false

jobs:
  monthly-site-check:
    name: Check portfolio links and files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run monthly site check
        id: site_check
        shell: bash
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          CHECK_EXTERNAL_LINKS: "1"
          CHECK_ANALYTICS_POST: "0"
          CHECK_TIMEOUT_MS: "15000"
        run: |
          set +e
          node tools/monthly-site-check.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-site-check-report
          path: reports/monthly-site-checks/
          if-no-files-found: error

      - name: Commit report
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- reports/monthly-site-checks; then
            echo "No report changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monthly-site-checks
          git commit -m "Add monthly site check report"
          git push

      - name: Fail if site check failed
        if: steps.site_check.outputs.status != '0'
        run: exit 1
